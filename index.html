<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fluchkasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Kassen-Summe oben, zwei große Knöpfe nebeneinander, Verlauf darunter. */
:root {
  --bg: #1a0507;
  --bg-2: #2a0a0e;
  --surface: #3a0f15;
  --line: #5c1a23;
  --red: #b3142b;
  --red-hi: #e0334c;
  --gold: #f0c27a;
  --fg: #f8e9ea;
  --muted: #c49aa0;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(120% 60% at 50% -10%, #5a0d18 0%, transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* Kopf */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; margin: 0; }
.sync {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
}
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.live::before { background: #4fd38a; box-shadow: 0 0 8px #4fd38a; }

/* Kasse */
.jar {
  text-align: center;
  padding-block: 8px 4px;
}
.jar-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
.jar-sum {
  font-family: var(--display); font-weight: 800;
  font-size: clamp(3.2rem, 17vw, 5rem); line-height: 1;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  margin-block: 6px 6px;
  text-shadow: 0 4px 30px rgba(240, 194, 122, 0.25);
}
.jar-sub { color: var(--muted); font-size: 0.9rem; }
.jar-sum.bump { animation: bump 0.35s ease-out; }
@keyframes bump { 40% { transform: scale(1.08); } }

/* Spieler */
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.player {
  background: linear-gradient(180deg, var(--bg-2), var(--bg));
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 14px 12px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  min-width: 0;
}
.name {
  font: inherit; font-weight: 700; font-size: 1rem; color: var(--fg);
  background: transparent; border: 1px dashed transparent; border-radius: 8px;
  text-align: center; width: 100%; padding: 4px 6px;
}
.name:hover { border-color: var(--line); }
.name:focus { outline: none; border-color: var(--red-hi); background: var(--surface); }

.press {
  position: relative;
  width: min(100%, 150px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%;
  border: 0;
  cursor: pointer;
  background: radial-gradient(circle at 35% 30%, var(--red-hi), var(--red) 55%, #7a0b1b 100%);
  box-shadow:
    0 8px 0 #4d0711,
    0 14px 30px rgba(0,0,0,0.55),
    inset 0 -6px 14px rgba(0,0,0,0.25),
    inset 0 4px 10px rgba(255,255,255,0.18);
  color: #fff;
  font-family: var(--display); font-weight: 800; font-size: 2.2rem;
  transition: transform 0.08s, box-shadow 0.08s;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
.press small { display: block; font-family: var(--body); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.06em; opacity: 0.85; margin-top: 2px; }
.press:active, .press.down {
  transform: translateY(6px);
  box-shadow: 0 2px 0 #4d0711, 0 6px 14px rgba(0,0,0,0.5), inset 0 -4px 10px rgba(0,0,0,0.25), inset 0 4px 10px rgba(255,255,255,0.12);
}
.press:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

.stats { display: flex; width: 100%; justify-content: space-around; gap: 8px; text-align: center; }
.stat-v { font-family: var(--display); font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-v.money { color: var(--gold); }
.stat-l { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.lead { font-size: 0.72rem; color: var(--gold); min-height: 1em; letter-spacing: 0.04em; }

/* Verlauf */
.section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin: 0 0 8px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 0.92rem;
}
.log li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { color: var(--muted); font-size: 0.92rem; padding: 10px 2px; }

/* Aktionen */
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: inherit; font-weight: 600; font-size: 0.9rem;
  color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 16px; cursor: pointer;
}
.btn:hover { border-color: var(--red-hi); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.danger { background: var(--red); border-color: var(--red-hi); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 0.9rem; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--fg); color: var(--bg);
  padding: 10px 14px 10px 18px; border-radius: 999px;
  display: flex; align-items: center; gap: 12px;
  font-weight: 600; font-size: 0.9rem;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  max-width: calc(100% - 32px);
}
.toast button {
  font: inherit; font-weight: 700; color: var(--red); background: transparent; border: 0; cursor: pointer; padding: 4px 6px;
}
.foot { color: var(--muted); font-size: 0.78rem; text-align: center; }

@media (max-width: 360px) {
  .players { gap: 8px; }
  .press { font-size: 1.8rem; }
}
@media (prefers-reduced-motion: reduce) {
  .jar-sum.bump { animation: none; }
  .press { transition: none; }
}

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="brand">Fluchkasse</h1>
    <span class="sync" id="sync">Verbinde …</span>
  </header>

  <section class="jar" aria-live="polite">
    <div class="jar-label">In der Kasse</div>
    <div class="jar-sum" id="sum">0,00 €</div>
    <div class="jar-sub" id="sumSub">0 Schimpfwörter · 0,50 € pro Wort</div>
  </section>

  <section class="players">
    <div class="player" data-who="a">
      <input class="name" id="name-a" value="Person 1" maxlength="20" aria-label="Name Person 1">
      <button class="press" id="press-a" type="button">+1<small>GEFLUCHT</small></button>
      <div class="stats">
        <div><div class="stat-v" id="count-a">0</div><div class="stat-l">Wörter</div></div>
        <div><div class="stat-v money" id="money-a">0,00 €</div><div class="stat-l">Schulden</div></div>
      </div>
      <div class="lead" id="lead-a"></div>
    </div>
    <div class="player" data-who="b">
      <input class="name" id="name-b" value="Person 2" maxlength="20" aria-label="Name Person 2">
      <button class="press" id="press-b" type="button">+1<small>GEFLUCHT</small></button>
      <div class="stats">
        <div><div class="stat-v" id="count-b">0</div><div class="stat-l">Wörter</div></div>
        <div><div class="stat-v money" id="money-b">0,00 €</div><div class="stat-l">Schulden</div></div>
      </div>
      <div class="lead" id="lead-b"></div>
    </div>
  </section>

  <section>
    <h2 class="section-title">Zuletzt geflucht</h2>
    <ul class="log" id="log"></ul>
    <div class="empty" id="empty">Noch alles sauber. Wer flucht, drückt auf seinen roten Knopf.</div>
  </section>

  <section class="actions" id="actions">
    <button class="btn" id="undo" type="button">Letzten Eintrag löschen</button>
    <button class="btn" id="reset" type="button">Kasse leeren</button>
  </section>
  <div class="confirm" id="confirm" hidden>
    <span>Alle Einträge löschen und bei 0 € neu anfangen?</span>
    <button class="btn danger" id="resetYes" type="button">Ja, leeren</button>
    <button class="btn" id="resetNo" type="button">Abbrechen</button>
  </div>

  <p class="foot">Namen antippen zum Umbenennen.</p>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastUndo" type="button">Rückgängig</button></div>

<!-- Firebase (optional, für Live-Sync zwischen den Handys) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  // Hier deine Firebase-Konfiguration einfügen (siehe README.md).
  // Solange hier null steht, zählt jedes Handy nur für sich.
  window.FIREBASE_CONFIG = null;
</script>
<script>
(() => {
  const PRICE = 0.5;
  const eur = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
  const time = new Intl.DateTimeFormat("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" });
  const $ = (id) => document.getElementById(id);

  let taps = [];                 // [{id, who, at}]
  let names = { a: "Person 1", b: "Person 2" };
  let store = null;              // backend: db or local

  // ---------- Backends ----------
  const LS_KEY = "fluchkasse-v1";
  function localStore() {
    const load = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } };
    const save = (s) => { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} };
    let s = load();
    s.taps ||= []; s.names ||= names;
    const emit = () => { taps = s.taps.slice(); names = { ...s.names }; render(); };
    return {
      live: false,
      start: emit,
      add: async (who) => { s.taps.push({ id: Math.random().toString(36).slice(2), who, at: Date.now() }); save(s); emit(); },
      remove: async (id) => { s.taps = s.taps.filter((t) => t.id !== id); save(s); emit(); },
      clear: async () => { s.taps = []; save(s); emit(); },
      setNames: async (n) => { s.names = n; save(s); emit(); },
    };
  }

  function firebaseStore(fdb) {
    const tapsRef = fdb.ref("taps");
    const namesRef = fdb.ref("names");
    return {
      live: true,
      start() {
        tapsRef.on("value", (snap) => {
          const v = snap.val() || {};
          taps = Object.entries(v).map(([id, t]) => ({ id, ...t }));
          render();
        }, () => setSync(false, "Offline"));
        namesRef.on("value", (snap) => {
          const v = snap.val();
          if (v) { names = { ...names, ...v }; render(); }
        });
        fdb.ref(".info/connected").on("value", (s) => setSync(!!s.val(), s.val() ? "Live geteilt" : "Offline"));
      },
      add: (who) => tapsRef.push({ who, at: Date.now() }),
      remove: (id) => tapsRef.child(id).remove(),
      clear: () => tapsRef.remove(),
      setNames: (n) => namesRef.set(n),
    };
  }

  function setSync(live, label) {
    const el = $("sync");
    el.textContent = label;
    el.classList.toggle("live", live);
  }

  // ---------- Render ----------
  let lastTotal = -1;
  function render() {
    const count = { a: 0, b: 0 };
    for (const t of taps) if (count[t.who] !== undefined) count[t.who]++;
    const total = count.a + count.b;

    $("sum").textContent = eur.format(total * PRICE);
    $("sumSub").textContent = `${total} ${total === 1 ? "Schimpfwort" : "Schimpfwörter"} · 0,50 € pro Wort`;
    if (lastTotal !== -1 && total > lastTotal) {
      const s = $("sum"); s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
    }
    lastTotal = total;

    for (const who of ["a", "b"]) {
      $("count-" + who).textContent = count[who];
      $("money-" + who).textContent = eur.format(count[who] * PRICE);
      const input = $("name-" + who);
      if (document.activeElement !== input) input.value = names[who];
      const other = who === "a" ? "b" : "a";
      $("lead-" + who).textContent = count[who] > count[other] ? "Größtes Schandmaul" : "";
    }

    const recent = taps.slice().sort((x, y) => y.at - x.at).slice(0, 8);
    const log = $("log");
    log.replaceChildren(...recent.map((t) => {
      const li = document.createElement("li");
      const a = document.createElement("span");
      a.textContent = `${names[t.who] || "?"} hat geflucht`;
      const b = document.createElement("span");
      b.textContent = time.format(new Date(t.at));
      li.append(a, b);
      return li;
    }));
    $("empty").hidden = recent.length > 0;
    $("undo").disabled = taps.length === 0;
  }

  // ---------- Toast ----------
  let toastTimer = null, toastTapAt = null, toastWho = null;
  function showToast(who) {
    toastWho = who; toastTapAt = Date.now();
    $("toastText").textContent = `+0,50 € für ${names[who]}`;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, 4000);
  }
  function newestOf(who) {
    return taps.filter((t) => !who || t.who === who).sort((x, y) => y.at - x.at)[0];
  }

  // ---------- Events ----------
  for (const who of ["a", "b"]) {
    const btn = $("press-" + who);
    btn.addEventListener("click", async () => {
      if (!store) return;
      try { navigator.vibrate?.(30); } catch {}
      showToast(who);
      try { await store.add(who); } catch { setSync(false, "Speichern fehlgeschlagen"); }
    });
    const input = $("name-" + who);
    input.addEventListener("change", () => {
      const v = input.value.trim() || (who === "a" ? "Person 1" : "Person 2");
      if (v === names[who]) return;
      names = { ...names, [who]: v };
      store?.setNames(names).catch(() => {});
      render();
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
  }

  $("toastUndo").addEventListener("click", () => {
    $("toast").hidden = true;
    const t = newestOf(toastWho);
    if (t) store?.remove(t.id).catch(() => {});
  });
  $("undo").addEventListener("click", () => {
    const t = newestOf();
    if (t) store?.remove(t.id).catch(() => {});
  });
  $("reset").addEventListener("click", () => { $("actions").hidden = true; $("confirm").hidden = false; });
  $("resetNo").addEventListener("click", () => { $("actions").hidden = false; $("confirm").hidden = true; });
  $("resetYes").addEventListener("click", async () => {
    $("actions").hidden = false; $("confirm").hidden = true;
    try { await store?.clear(); } catch {}
  });

  // ---------- Boot ----------
  render();
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.databaseURL && window.firebase) {
    try {
      firebase.initializeApp(cfg);
      store = firebaseStore(firebase.database());
      store.start();
      setSync(false, "Verbinde …");
    } catch (e) {
      store = localStore(); store.start();
      setSync(false, "Nur dieses Gerät");
    }
  } else {
    store = localStore(); store.start();
    setSync(false, "Nur dieses Gerät");
  }
})();
</script>
</body>
</html>
